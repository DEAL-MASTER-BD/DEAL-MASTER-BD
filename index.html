<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEAL MASTER BD - Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f8;color:#222}
header{background:#087c48;color:white;padding:20px}
header h2{margin:0}
main{max-width:950px;margin:auto;padding:18px}
.card{background:white;padding:18px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
button{background:#087c48;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer}
.status{color:#b77900;font-weight:bold}
</style>
</head>
<body>
<header>
<h2>🛍️ DEAL MASTER BD</h2>
<p>Automatic Deals Admin Panel</p>
</header>
<main>
<div class="card">
<h3>Dashboard</h3>
<p>Welcome to DEAL MASTER BD</p>
<p>System Status: <span class="status">Setup Pending</span></p>
</div>
<div class="card">
<h3>📢 Telegram Posting</h3>
<p>Telegram automatic posting setup</p>
<button onclick="alert('Telegram setup will be added next')">Configure</button>
</div>
<div class="card">
<h3>🟢 WhatsApp Channel</h3>
<p>WhatsApp posting preparation</p>
<button onclick="alert('WhatsApp setup will be added next')">Configure</button>
</div>
<div class="card">
<h3>🛒 Daraz Affiliate</h3>
<p>Affiliate deal management</p>
<button onclick="alert('Daraz setup will be added next')">Manage Deals</button>
</div>
</main>
</body>
</html>
